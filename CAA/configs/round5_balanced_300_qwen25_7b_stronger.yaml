seed: 20260712
num_attacks: 300
max_attacker_turns: 15

attacker_model:
  provider: huggingface
  backend: transformers
  model_id: meta-llama/Llama-3.1-8B-Instruct
  local_path: /home/david-qu/hf_cache/hub/models--meta-llama--Llama-3.1-8B-Instruct
  device_map: auto
  torch_dtype: auto
  max_new_tokens: 256
